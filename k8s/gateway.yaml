# Requires a Gateway API implementation installed in the cluster.
# Set gatewayClassName to match it (e.g., "eg" for Envoy Gateway, "nginx" for NGINX Gateway Fabric).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: llm
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
