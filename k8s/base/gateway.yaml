# Gateway API front door. Requires a Gateway API implementation; scripts/ install Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: llm
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-route
  namespace: llm
spec:
  parentRefs:
    - name: llm-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /v1 }
      timeouts:
        request: 300s # long generations
      backendRefs:
        - name: vllm
          port: 8000
