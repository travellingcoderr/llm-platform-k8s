# Recording rules that turn vLLM counters into throughput, latency and cost per 1M tokens.
# Set llm_instance_usd_per_hour to your node price (g5.xlarge on-demand us-east-1: 1.006, Nov 2026).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-cost
  namespace: llm
spec:
  groups:
    - name: llm.cost
      interval: 30s
      rules:
        - record: llm_instance_usd_per_hour
          expr: vector(1.006)
        - record: llm:generation_tokens:rate5m
          expr: sum(rate(vllm:generation_tokens_total[5m]))
        - record: llm:prompt_tokens:rate5m
          expr: sum(rate(vllm:prompt_tokens_total[5m]))
        - record: llm:e2e_latency_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (le) (rate(vllm:e2e_request_latency_seconds_bucket[5m])))
        - record: llm:ttft_seconds:p95_5m
          expr: histogram_quantile(0.95, sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m])))
        # cost of the node for one hour / output tokens produced in one hour (at the current rate)
        - record: llm:usd_per_1m_output_tokens
          expr: (scalar(llm_instance_usd_per_hour) / 3600) / clamp_min(llm:generation_tokens:rate5m, 0.001) * 1e6
    - name: llm.alerts
      rules:
        - alert: LLMQueueBacklog
          expr: sum(vllm:num_requests_waiting) > 10
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: vLLM has more than 10 queued requests for 5 minutes (scale out or shed load)
        - alert: LLMKVCacheNearlyFull
          expr: max(vllm:kv_cache_usage_perc) > 0.95
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: KV cache above 95 percent; expect preemption and latency spikes
